# Runtime dependencies stay provider-neutral and support offline wheel mirroring.
[project]
name = "lm-platform-ai-service"
version = "0.1.0"
description = "AI capability service for the offline LLM platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.138.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "uvicorn[standard]==0.49.0",
    "python-multipart==0.0.32",
    "pypdf==5.9.0",
    "pymupdf==1.28.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "pillow==11.3.0",
    "pytesseract==0.3.13",
    "cryptography==45.0.7",
]

# Test tooling is kept optional so production images contain only runtime packages.
[project.optional-dependencies]
test = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
]

# Explicit package discovery prevents config JSON directories from becoming Python packages.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
