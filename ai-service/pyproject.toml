# Runtime dependencies stay provider-neutral and support offline wheel mirroring.
[project]
name = "lm-platform-ai-service"
version = "0.1.0"
description = "AI capability service for the offline LLM platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

# Test tooling is kept optional so production images contain only runtime packages.
[project.optional-dependencies]
test = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
]

# Explicit package discovery prevents config JSON directories from becoming Python packages.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
