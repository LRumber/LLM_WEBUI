# Core HTTP service and secure session-cookie defaults.
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

# Framework, database migration, and JSON serialization settings.
spring:
  session:
    store-type: ${SESSION_STORE_TYPE:none}
    timeout: ${SESSION_TIMEOUT:8h}
    redis:
      namespace: lm-platform:session
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_BYTES:104857600}
      max-request-size: ${MAX_UPLOAD_BYTES:104857600}
  mvc:
    async:
      request-timeout: 180000
  application:
    name: lm-platform-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lm_platform}
    username: ${POSTGRES_USER:lm_platform}
    password: ${POSTGRES_PASSWORD:change-me}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

# Platform-owned integrations remain environment-configurable for offline deployments.
platform:
  auth:
    dev-login-enabled: ${DEV_LOGIN_ENABLED:false}
  admin:
    bootstrap:
      username: ${ADMIN_INITIAL_USERNAME:}
      password: ${ADMIN_INITIAL_PASSWORD:}
      display-name: ${ADMIN_INITIAL_DISPLAY_NAME:系统管理员}
  oauth2:
    server: ${OAUTH2_SERVER:http://sso.sitp.ac.cn}
    client-id: ${OAUTH2_CLIENT_ID:replace-me}
    client-secret: ${OAUTH2_CLIENT_SECRET:replace-me}
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/callback}
    send-state: ${OAUTH2_SEND_STATE:false}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:150}
    # Keep title generation independently configurable so it can move to a small local model.
    title-model: ${AI_TITLE_MODEL:deepseek-chat}
    # Bound history independently from model token limits; provider tokenization remains authoritative.
    max-context-messages: ${AI_MAX_CONTEXT_MESSAGES:40}
  legacy-chat-import:
    enabled: ${LEGACY_CHAT_IMPORT_ENABLED:false}
    data-root: ${LEGACY_CHAT_DATA_ROOT:/legacy-data}
    default-model: ${LEGACY_CHAT_DEFAULT_MODEL:legacy-import}
  object-storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:lm_platform}
    secret-key: ${MINIO_ROOT_PASSWORD:change-me-now}
    bucket: ${MINIO_BUCKET:lm-platform-files}
    max-file-bytes: ${MAX_UPLOAD_BYTES:104857600}
  knowledge:
    chunk-tokens: ${KNOWLEDGE_CHUNK_TOKENS:600}
    overlap-tokens: ${KNOWLEDGE_OVERLAP_TOKENS:100}
    embedding-batch-size: ${KNOWLEDGE_EMBEDDING_BATCH_SIZE:16}

# Expose only the operational endpoints required by local monitoring.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
